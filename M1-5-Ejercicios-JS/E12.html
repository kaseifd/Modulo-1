<body>
    <script>
        let pulgadas = parseInt(window.prompt("Introduce un número en pulgadas:"))

        let pulgadasAMetros = 0.0254

        let metros = pulgadas * pulgadasAMetros

        alert(`${metros} pulgadas equivalen a: ${metros}m.`)
    </script>
