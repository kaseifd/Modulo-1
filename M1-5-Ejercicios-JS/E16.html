<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 16</title>
</head>
<body>
    <script>
        let number = window.prompt("Escribe un número de 3 dígitos:")
        let firstNumber = parseInt(number / 100) 
        console.log(firstNumber)
        
        
        let secondNumber = parseInt(((firstNumber * 100 - number) *-1) / 10) 
        console.log(secondNumber)
        
        let thirdNumber = number - (firstNumber * 100) - (secondNumber * 10)

        let suma = firstNumber + secondNumber + thirdNumber 
        alert(suma)
    </script>
</body>
</html>
