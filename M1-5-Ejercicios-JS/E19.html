<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 19</title>
</head>

<body>
    <script>
        let number1 = parseInt(window.prompt("Introduce el dividendo:"))
        let number2 = parseInt(window.prompt("Introduce el divisor:")) 
        let division = number1/number2

        let decimales = division - Math.trunc(division) //Math.trunc se queda con el número entero (lo de antes del punto). Al restar al número con decimales el número sin decimales, nos quedan los decimales. Ej.: 5.75 - 5 = 0.75
        let remainder = parseInt(decimales * number2) 

        alert(`El resto es ${remainder}`)

    </script>
</body>

</html>
