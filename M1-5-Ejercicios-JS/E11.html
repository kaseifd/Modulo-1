<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 11</title>
</head>

<body>
    <script>
        let celsius = parseInt(window.prompt("Introduce la temperatura en Celsius:"))

        let fahrenheit = (celsius * 9 / 5) + 32

        alert(`La temperatura es: ${celsius}°C o ${fahrenheit}°F.`)
    </script>
</body>

</html>
