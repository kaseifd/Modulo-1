<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 7</title>
</head>
<body>
    <script>
        let number1 = parseInt(window.prompt("Escribe el primer número:"))
        let number2 = parseInt(window.prompt("Escribe el segundo número:")) 

        let suma = number1 + number2
        let resta = number1 - number2
        let mult = number1 * number2
        let division = number1 / number2
        let resto = number1 % number2

        alert(`El resultado de sumarlos es: ${suma}. El resultado de restarlos es: ${resta}. El resultado de multilicarlos es: ${mult}.El resultado de dividirlos es: ${division}. El resto de la división es: ${resto}.`)
    </script>
</body>
</html>
