<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 13</title>
</head>

<body>
    <script>
        let height = parseInt(window.prompt("Introduce la altura de un rectángulo:"))
        let width = parseInt(window.prompt("Introduce la anchura de un rectángulo:"))

        let area = height * width
        let perimetro = 2 * (height + width)
    
        alert(`El área de ese rectángulo es: ${area}. El perímetro es: ${perimetro}.`)
    </script>
</body>

</html>
