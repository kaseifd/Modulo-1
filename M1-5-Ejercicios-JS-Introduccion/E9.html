<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-5-Ejercicio 9</title>
</head>
<body>
    <script>
        let radio = parseInt(window.prompt("Introduce el radio de un círculo:"))

        let area = Math.PI * radio ** 2
        let perimetro = 2 * Math.PI * radio
    
        alert(`El área de ese círculo es: ${area}. El perímetro es: ${perimetro}.`)
    </script>
</body>
</html>
