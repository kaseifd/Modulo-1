<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-4-Ejercicio 2</title>
</head>
<style>
    * {
        color: white;
        /* border: 1px solid red; */
        margin: 0;
    }
    
    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 32px;
        background-color: rgb(97, 155, 209);
    }

    #button_bar {
        display: flex;
        list-style: none;
        column-gap: 40px;
    }

    a {
        text-decoration: none;
    }

    h1 {
        text-transform: uppercase;
    }

    li {
        text-transform: uppercase;
    }

    #title {
        text-align: right;
    }

</style>
<body>
    <header>
        <nav>
            <div id="title">
                <h1>Título de la página</h1>
                <h2>Subtítulo</h2>
            </div>
            <div >
                <ul id="button_bar">
                    <li><a href="#">Google</a></li>
                    <li><a href="#">Yahoo</a></li>
                    <li><a href="#">Duck Duck Go</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
