<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M1-4-Ejercicio 1</title>
</head>
<style>
    * {
        margin: 0;
    }
    nav {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 24px 32px;
        background-color: rgb(105, 199, 152);
    }

    h1 {
        color: white;
        text-transform: uppercase;
    }

    #button_bar {
        display: flex;
        list-style: none;
        column-gap: 16px;
    }

    a {
        color: rgb(105, 199, 152);
        text-decoration: none;
    }

    li {
        padding: 8px 16px;
        border-radius: 8px;
        background-color: white;
    }


</style>
<body>
    <header>
        <nav>
            <div>
                <h1>Título</h1>
            </div>
            <div >
                <ul id="button_bar">
                    <li><a href="#">Google</a></li>
                    <li><a href="#">Yahoo</a></li>
                    <li><a href="#">Duck Duck Go</a></li>
                </ul>
            </div>
        </nav>
    </header>
</body>
</html>
