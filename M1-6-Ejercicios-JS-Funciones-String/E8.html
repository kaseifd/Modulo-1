<body>
    <script>
        let suma = prompt("Introduce una suma")
        let indexSymbol = suma.indexOf("+")
        let firstNumber = suma.substring(0, indexSymbol)
        let secondNumber = suma.substring(indexSymbol+1, suma.length)

        console.log(firstNumber, secondNumber)
    </script>
